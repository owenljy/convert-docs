[project]
name = "convert-docs"
version = "0.4.0"
description = "Convert documents (pdf, docx, pptx, xlsx, ...) to Markdown via markitdown, recursively for a folder or directly for a single file."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markitdown[pdf,docx,pptx,xlsx,xls,outlook]>=0.1.5",
]

[project.scripts]
convert-docs = "convert_docs.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/convert_docs"]
